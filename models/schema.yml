version: 2

models:
  - name: orders
    description: Cleaned order transactions.
    columns:
      - name: order_id
        description: Primary key of the order.
      - name: customer_id
        description: Customer identifier.
      - name: order_date
        description: Date the order was placed.
      - name: amount
        description: Order total amount in base currency.
      - name: currency
        description: ISO currency code.
      - name: is_valid
        description: Whether the order passed fraud checks.
      - name: notes
        description: Internal free-text notes (unused downstream).
  - name: customers
    description: Cleaned customer directory.
    columns:
      - name: customer_id
      - name: email
      - name: signup_date
      - name: country
  - name: metricflow_time_spine
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day

semantic_models:
  - name: orders_sm
    description: Orders semantic model for MetricFlow.
    model: ref('orders')
    defaults:
      agg_time_dimension: order_date
    entities:
      - name: order_id
        type: primary
      - name: customer_id
        type: foreign
    dimensions:
      - name: order_date
        type: time
        type_params:
          time_granularity: day
    measures:
      - name: order_revenue
        agg: sum
        expr: CASE WHEN is_valid THEN amount ELSE 0 END
      - name: order_count
        agg: sum
        expr: "1"

metrics:
  - name: revenue
    label: Total Revenue
    description: Sum of valid order amounts.
    type: simple
    type_params:
      measure: order_revenue
  - name: order_volume
    label: Order Volume
    description: Total count of orders.
    type: simple
    type_params:
      measure: order_count
  - name: aov
    label: Average Order Value
    description: Revenue divided by order volume.
    type: ratio
    type_params:
      numerator: revenue
      denominator: order_volume
