version: 2

sources:
  - name: raw
    database: acme-analytics-prod
    schema: raw
    tables:
      - name: orders
        description: Raw order events loaded by Airflow.
        columns:
          - name: order_id
          - name: customer_id
          - name: order_date
          - name: amount
          - name: currency
          - name: is_valid
          - name: notes
      - name: customers
        description: Raw customer master records loaded by Airflow.
        columns:
          - name: customer_id
          - name: email
          - name: signup_date
          - name: country
